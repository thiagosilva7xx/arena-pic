<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6">
<title>Arena PIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Superfícies e tinta */
  --bg:#F4EFE6;
  --bg-dot:#D8D0C1;
  --surface:#FFFDF9;
  --surface-alt:#EAE3D5;
  --ink:#181A1F;
  --muted:#63666F;
  --line:#D5CEC0;
  --shadow:#DDD5C5;
  /* Equipes e estados */
  --team-a:#1D56D8;
  --team-a-soft:#E7EEFC;
  --team-a-dark:#123994;
  --team-b:#D9531E;
  --team-b-soft:#FDECE5;
  --team-b-dark:#99350E;
  --ok:#168053;
  --ok-soft:#E3F5EC;
  --ok-dark:#0E5436;
  --bad:#C92A3E;
  --bad-soft:#FDE8EB;
  --gold:#D49A1A;
  --gold-soft:#FDF6E3;
  /* Tipografia */
  --f-disp:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  /* Medições e escala espacial (base 4px) */
  --r-sm:10px;
  --r-md:14px;
  --r-lg:16px;
  --b-thin:1.5px;
  --b-bold:2px;
  --sh-card:0 4px 0 var(--shadow);
  --sh-key:0 4px 0 var(--ink);
  --side-w:300px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--bg-dot) 1.2px,transparent 1.2px);
  background-size:22px 22px;
  color:var(--ink);
  font:500 15px/1.45 var(--f-ui);
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}

/* Contêiner principal com medição por contexto:
   - Telas de formulário (Home, Lobby, Placar): máx 520px (até 620px em paisagem)
   - Tela de jogo ativo (.play): expande até 1040px em paisagem para 2 colunas
   - Telão (.wide): largura total com margem de projeção */
#app{max-width:520px;margin:0 auto;padding:16px 14px 72px;position:relative}
#app.wide{max-width:none;padding:12px 24px 28px}
@media (orientation:landscape) and (min-width:600px){
  #app:not(.wide):not(.play){max-width:600px;padding:14px 20px 64px}
  #app.play{max-width:1040px;padding:10px 18px 28px}
}
@media (orientation:landscape) and (min-width:600px) and (max-width:780px){
  :root{--side-w:268px}
}

#app.enter>*{animation:rise .28s cubic-bezier(.2,.9,.3,1) both}
#app.enter>*:nth-child(2){animation-delay:.03s}
#app.enter>*:nth-child(3){animation-delay:.06s}
#app.enter>*:nth-child(4){animation-delay:.09s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

h2{font:800 19px/1.2 var(--f-disp);letter-spacing:-.3px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 4px}
.logo{
  font:800 32px/1 var(--f-disp);
  letter-spacing:-.6px;
  display:inline-flex;align-items:center;gap:7px;
  margin:0;
}
.logo span{
  display:inline-block;
  background:var(--ink);color:var(--bg);
  padding:3px 9px 4px;
  transform:rotate(-2.5deg);
  border-radius:7px;
  font-size:23px;letter-spacing:.5px;
}
.pillbtn{
  display:inline-flex;align-items:center;gap:6px;
  font:700 13px/1 var(--f-ui);
  padding:8px 13px;
  border:var(--b-thin) solid var(--ink);
  border-radius:999px;
  background:var(--surface);color:var(--ink);
  cursor:pointer;
  box-shadow:0 3px 0 var(--ink);
  transition:transform .08s,box-shadow .08s,background .14s;
}
.pillbtn:hover{background:var(--gold-soft)}
.pillbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}

/* Cards e rótulos */
.card{
  background:var(--surface);
  border:var(--b-thin) solid var(--ink);
  border-radius:var(--r-lg);
  padding:15px;
  margin:12px 0;
  box-shadow:var(--sh-card);
}
.card.compact{padding:12px 14px}
.lbl{
  font:800 10.5px/1 var(--f-mono);
  letter-spacing:1.3px;text-transform:uppercase;
  color:var(--muted);
  margin:0 0 8px;display:block;
}
label{display:block;font:700 12px/1.2 var(--f-ui);color:var(--muted);margin:10px 0 4px}
.row label{margin-top:0}

/* Inputs (>= 16px evita zoom automático no iOS Safari) */
input,select{
  width:100%;height:46px;
  font:600 16px/1.2 var(--f-ui);
  padding:0 12px;
  border:var(--b-thin) solid var(--line);
  border-radius:var(--r-sm);
  background:var(--surface);color:var(--ink);
  transition:border-color .15s,box-shadow .15s,background .15s;
}
input:focus,select:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px rgba(24,26,31,.11)}
input::placeholder{color:#A39D91;font-weight:500}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
@media(max-width:350px){.row.stack-xs{flex-direction:column}}

.codein{
  height:64px;
  font:800 30px/1 var(--f-mono);
  letter-spacing:11px;
  text-align:center;text-transform:uppercase;
  background:var(--bg);
  border:var(--b-bold) dashed var(--ink);
  padding-left:22px;
}
.codein:focus{background:var(--surface);border-style:solid}

/* Abas e seletores segmentados */
.segs{
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  background:var(--surface-alt);
  border:var(--b-thin) solid var(--line);
  border-radius:var(--r-md);
  padding:4px;
  margin:14px 0 10px;
}
.seg{
  height:40px;
  border:var(--b-thin) solid transparent;
  border-radius:10px;
  background:none;
  font:700 13.5px/1 var(--f-ui);
  color:var(--muted);
  cursor:pointer;
  transition:all .14s;
}
.seg.on{
  background:var(--surface);
  border-color:var(--ink);
  color:var(--ink);
  box-shadow:0 2px 0 var(--shadow);
}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.tg .seg small{display:block;font:600 11px/1 var(--f-ui);opacity:.7;margin-top:4px}
/* Damas */
.g-board.dm{display:flex;justify-content:center}
.dboard{width:var(--dsz);height:var(--dsz);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border:var(--b-bold) solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 5px 0 var(--shadow);background:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
.dsq{position:relative;display:flex;align-items:center;justify-content:center}
.dsq.l{background:#F1EAD8}.dsq.d{background:#33363E}
.dsq[data-act]{cursor:pointer}
.dsq.last{box-shadow:inset 0 0 0 3px rgba(212,154,26,.9)}
.dsq.capd::after{content:'';width:22%;height:22%;border-radius:50%;border:2px solid rgba(255,253,249,.45)}
.dsq.sel{box-shadow:inset 0 0 0 3px var(--surface)}
.dsq.trail{box-shadow:inset 0 0 0 3px rgba(255,253,249,.55)}
.dsq.tgt::after{content:'';width:30%;height:30%;border-radius:50%;background:var(--surface);box-shadow:0 0 0 4px rgba(255,253,249,.28);position:absolute}
.pc{position:relative;width:80%;height:80%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(0,0,0,.38),inset 0 0 0 4px rgba(0,0,0,.14),inset 0 0 0 7px rgba(255,255,255,.2)}
.pc.A{background:radial-gradient(circle at 34% 28%,#5C8DF2,var(--team-a) 62%)}
.pc.B{background:radial-gradient(circle at 34% 28%,#F58D63,var(--team-b) 62%)}
.pc svg{width:54%;height:54%;color:#FFF1BE;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.pc.k{box-shadow:0 3px 0 rgba(0,0,0,.38),0 0 0 2px var(--gold),inset 0 0 0 4px rgba(0,0,0,.14),inset 0 0 0 7px rgba(255,255,255,.2)}
.dsq.last .pc{animation:dmpop .3s ease-out}
.dsq.mov .pc{animation:dmpulse 1.5s ease-in-out infinite}
@keyframes dmpop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes dmpulse{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.38),0 0 0 0 rgba(255,253,249,.0),inset 0 0 0 4px rgba(0,0,0,.14),inset 0 0 0 7px rgba(255,255,255,.2)}
  50%{box-shadow:0 3px 0 rgba(0,0,0,.38),0 0 0 4px rgba(255,253,249,.55),inset 0 0 0 4px rgba(0,0,0,.14),inset 0 0 0 7px rgba(255,255,255,.2)}}
.dmeta{display:flex;gap:8px;justify-content:center}
.dc{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;border:var(--b-thin) solid var(--line);background:var(--surface);font:700 13px/1 var(--f-ui)}
.dc b{font:800 15px/1 var(--f-mono)}
.dc.A{color:var(--team-a-dark);border-color:var(--team-a)}.dc.B{color:var(--team-b-dark);border-color:var(--team-b)}
.dmeta.big .dc{font-size:18px;padding:8px 18px}.dmeta.big{margin-bottom:12px}
.dtela{display:flex;justify-content:center}
.tturn .dboard{margin:0 auto}

.tclock{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:12px;font-weight:700;color:var(--muted)}
.tclock .bg{flex:1;height:8px;border-radius:99px;background:#E4DDCB;overflow:hidden}
.tclock i{display:block;height:100%;width:100%;background:var(--ink);border-radius:99px}
.tclock b{min-width:1.6em;text-align:right;font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.tclock.low i{background:var(--bad)}.tclock.low b{color:var(--bad)}
.tclock.big{max-width:520px;margin:0 auto 14px;font-size:15px}.tclock.big .bg{height:12px}.tclock.big b{font-size:28px;min-width:1.8em}
.tg .seg{
  flex:1 1 30%;min-height:42px;height:auto;padding:8px 4px;
  border-color:var(--line);
  background:var(--surface);color:var(--ink);
}
.tg .seg.on{
  background:var(--ink);color:var(--surface);
  border-color:var(--ink);box-shadow:none;
}

/* Grade de jogos (2 colunas equilibradas; 5º card ocupa largura total sem buraco) */
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.gcard{
  position:relative;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  text-align:left;
  padding:11px 12px;
  border:var(--b-thin) solid var(--line);
  border-radius:13px;
  background:var(--surface);color:var(--ink);
  cursor:pointer;
  transition:transform .08s,border-color .14s,box-shadow .14s,background .14s;
}
.gcard:hover{border-color:var(--ink)}
.gcard .gtop{display:flex;width:100%;align-items:center;justify-content:space-between;gap:6px}
.gcard .gico{
  width:32px;height:32px;border-radius:9px;
  background:var(--surface-alt);color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.gcard .gico svg{width:20px;height:20px}
.gcard b{font:800 14.5px/1.18 var(--f-disp);letter-spacing:-.2px}
.gcard i{
  font:700 10px/1 var(--f-mono);
  letter-spacing:.7px;text-transform:uppercase;
  color:var(--muted);font-style:normal;
  background:var(--surface-alt);
  padding:3px 7px;border-radius:99px;
}
.gcard.on{
  border-color:var(--ink);
  background:var(--gold-soft);
  box-shadow:0 3px 0 var(--ink);
  transform:translateY(-1px);
}
.gcard.on .gico{background:var(--ink);color:var(--surface)}
.gcard.on i{background:var(--surface);color:var(--ink)}
.gcard.span2{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px}
.gcard.span2 .gtop{width:auto}
.gcard.span2 b{flex:1}

.gdesc{
  font-size:13.5px;color:#3E3A30;
  background:var(--bg);
  border-left:3px solid var(--gold);
  border-radius:0 9px 9px 0;
  padding:8px 11px;
  margin:10px 0 4px;line-height:1.42;
}
.gdesc.plain{background:none;border:0;padding:0;color:var(--muted);margin:6px 0 0;font-size:13px}
.fold{overflow:hidden;animation:rise .22s both}

/* Botões táteis */
.btn{
  --c:var(--ink);--tx:var(--surface);--sh:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:48px;
  font:800 15.5px/1 var(--f-ui);letter-spacing:.15px;
  border:var(--b-thin) solid var(--sh);
  border-radius:12px;
  background:var(--c);color:var(--tx);
  cursor:pointer;margin-top:12px;
  box-shadow:0 4px 0 var(--sh);
  transition:transform .08s,box-shadow .08s,filter .14s;
}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.btn.sec{--c:var(--surface);--tx:var(--ink);--sh:var(--ink)}
.btn.sec:hover:not(:disabled){background:var(--bg);filter:none}
.btn.az{--c:var(--team-a);--sh:var(--team-a-dark)}
.btn.la{--c:var(--team-b);--sh:var(--team-b-dark)}
.btn.ok{--c:var(--ok);--sh:var(--ok-dark)}
.btn:disabled{opacity:.38;cursor:default;box-shadow:none;transform:translateY(2px)}

.link{
  display:block;margin:12px auto 0;
  background:none;border:0;color:var(--muted);
  text-decoration:underline;text-underline-offset:3px;
  font:700 13.5px var(--f-ui);padding:8px 12px;cursor:pointer;
}
.link:hover{color:var(--ink)}
.center{text-align:center}

/* Mensagens e dicas */
.msg{
  display:block;text-align:center;
  font:800 14.5px/1.25 var(--f-ui);
  margin:0;padding:9px 14px;
  border-radius:11px;
  background:var(--surface-alt);color:var(--ink);
  border:var(--b-thin) solid var(--line);
}
.msg:empty{display:none}
.msg.A{background:var(--team-a-soft);color:var(--team-a);border-color:#B7CEF7}
.msg.B{background:var(--team-b-soft);color:var(--team-b);border-color:#F6C4B0}
.msg.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok);border-color:#A6DEC5}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

.tip{
  background:#EFE9DC;
  border:1px solid #DDD4C1;
  border-left:4px solid var(--gold);
  border-radius:4px 12px 12px 4px;
  padding:10px 13px;font-size:13.5px;line-height:1.45;
  color:#2E2A20;margin:12px 0;
}
.tip b.k{
  display:block;font:800 10px/1 var(--f-mono);
  letter-spacing:1.3px;text-transform:uppercase;
  color:#7A5A0E;margin-bottom:4px;
}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.badge{
  font:700 12px/1 var(--f-ui);
  padding:5px 11px;
  border:1.5px solid var(--ink);
  border-radius:99px;background:var(--surface);
}
.pill{
  display:inline-flex;align-items:center;
  padding:3px 10px;border-radius:99px;
  font:800 11px/1.2 var(--f-ui);letter-spacing:.7px;color:#fff;
}
.pill.A{background:var(--team-a)}.pill.B{background:var(--team-b)}

/* Lobby */
.ticket{
  background:var(--ink);color:var(--surface);
  border-radius:var(--r-lg);
  padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;
  margin:4px 0;
  box-shadow:0 4px 0 #3A3D46;
}
.ticket small{
  display:block;font:700 10px/1 var(--f-mono);
  letter-spacing:1.4px;text-transform:uppercase;color:#A9AFB9;margin-bottom:4px;
}
.ticket .code{font:800 clamp(34px,9vw,46px)/1 var(--f-mono);letter-spacing:7px}
.ticket button{
  font:700 13px/1 var(--f-ui);
  padding:9px 14px;border-radius:99px;
  border:1.5px solid rgba(255,253,249,.65);
  background:rgba(255,253,249,.08);color:var(--surface);
  cursor:pointer;transition:background .14s;
}
.ticket button:hover{background:rgba(255,253,249,.18)}
.ticket button:active{background:var(--surface);color:var(--ink)}

.teams{display:grid;gap:10px;margin:12px 0}
@media (min-width:440px){.teams:not(.solo-one){grid-template-columns:1fr 1fr}}
.teams.solo-one{max-width:340px;margin:12px auto}
.tcard{
  background:var(--surface);
  border:var(--b-thin) solid var(--ink);
  border-top-width:5px;border-radius:var(--r-md);
  padding:12px;box-shadow:var(--sh-card);
  display:flex;flex-direction:column;justify-content:space-between;
}
.tcard.A{border-top-color:var(--team-a)}.tcard.B{border-top-color:var(--team-b)}
.tc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tc-cnt{font:700 12px/1 var(--f-mono);color:var(--muted)}
.slot{
  border:1.5px dashed var(--line);border-radius:10px;
  padding:10px 11px;color:#938C80;font-size:13.5px;font-weight:600;
  margin-top:7px;text-align:center;
}
.slot.full{
  border:1.5px solid var(--line);border-style:solid;
  color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:var(--bg);text-align:left;
}
.slot.full small{color:var(--muted);font-weight:600;font-size:12px}
.wait{text-align:center;color:var(--muted);font-weight:700;margin:14px 0;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}

/* Placar de mesa unificado */
.score{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;
  background:var(--surface);
  border:var(--b-thin) solid var(--ink);
  border-radius:var(--r-md);
  overflow:hidden;margin:0 0 10px;
  box-shadow:0 3px 0 var(--shadow);
}
.sb{flex:1;display:flex;gap:8px;padding:7px 9px;min-width:0;align-items:center}
.sb.B{flex-direction:row-reverse;text-align:right}
.sb i{flex:none;width:5px;align-self:stretch;border-radius:3px;background:var(--team-a)}
.sb.B i{background:var(--team-b)}
.sb>div{min-width:0}
.sb b{display:block;font:800 13.5px/1.15 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb small{display:block;font:600 11px/1.25 var(--f-ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.sb u{text-decoration:none;font-weight:800;color:var(--team-a)}
.sb.B u{color:var(--team-b)}
.smid{
  background:var(--ink);color:var(--bg);
  padding:6px 13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:78px;white-space:nowrap;
}
.smid b{font:800 20px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.smid small{font:700 9px/1 var(--f-mono);letter-spacing:1.1px;text-transform:uppercase;margin-top:4px;color:#A9AFB9}
.rot{font-size:12px;color:var(--muted);text-align:center;margin:-4px 0 8px}
@media (orientation:landscape){.rot{display:none}}

/* Grade da tela de jogo (retrato = pilha vertical; paisagem = tabuleiro + coluna lateral) */
.gx{
  display:grid;gap:10px;
  grid-template-columns:minmax(0,1fr);
  grid-template-areas:"msg" "board" "meta" "tools" "info";
}
.gx.pic{grid-template-areas:"meta" "msg" "board" "tools" "info"}
.g-msg{grid-area:msg}.g-board{grid-area:board}.g-meta{grid-area:meta}.g-tools{grid-area:tools}.g-info{grid-area:info}
.g-info>:empty{display:none}
.g-info .card{margin:0 0 6px}
.g-info .tip{margin:0 0 6px}
.g-info .link{margin-top:4px}

@media (orientation:landscape) and (min-width:600px){
  .gx{
    grid-template-columns:minmax(0,1fr) var(--side-w);
    grid-template-areas:"board msg" "board meta" "board tools" "board info";
    grid-template-rows:auto auto auto 1fr;
    align-items:start;column-gap:16px;row-gap:9px;
  }
  .gx.pic{grid-template-areas:"board meta" "board msg" "board tools" "board info"}

function pilarMove(o,x,y,d){
  if(o===0){if(d===0)return[2,x,y-2];if(d===2)return[2,x,y+1];if(d===3)return[1,x-2,y];return[1,x+1,y]}
  if(o===1){if(d===3)return[0,x-1,y];if(d===1)return[0,x+2,y];if(d===0)return[1,x,y-1];return[1,x,y+1]}
  if(d===0)return[0,x,y-1];if(d===2)return[0,x,y+2];if(d===3)return[2,x-1,y];return[2,x+1,y];
}
const pilarCells=(o,x,y)=>o===0?[[x,y]]:o===1?[[x,y],[x+1,y]]:[[x,y],[x,y+1]];
const pilarOk=(L,o,x,y)=>pilarCells(o,x,y).every(([cx,cy])=>cx>=0&&cy>=0&&cx<PW&&cy<PH&&L.floor[cy][cx]);
function pilarBFS(L,sx,sy){
  const key=(o,x,y)=>(o*PH+y)*PW+x;const dist=new Map([[key(0,sx,sy),0]]);let q=[[0,sx,sy]];
  while(q.length){const nq=[];for(const [o,x,y] of q){const dd=dist.get(key(o,x,y));
    for(let d=0;d<4;d++){const [no,nx,ny]=pilarMove(o,x,y,d);if(!pilarOk(L,no,nx,ny))continue;const k=key(no,nx,ny);if(dist.has(k))continue;dist.set(k,dd+1);nq.push([no,nx,ny])}}q=nq}
  return dist;
}
function genPilar(seed){
  for(let attempt=0;attempt<60;attempt++){
    const R=rng(seed+attempt*7919);
    for(let tries=0;tries<80;tries++){
      const floor=Array.from({length:PH},()=>Array(PW).fill(0));
      const cells=[[1+Math.floor(R()*(PW-2)),1+Math.floor(R()*(PH-2))]];floor[cells[0][1]][cells[0][0]]=1;
      const target=28+Math.floor(R()*10);let g=0;
      while(cells.length<target&&g++<3000){
        const [cx,cy]=cells[Math.floor(R()*cells.length)];const d=DIRS[Math.floor(R()*4)];const nx=cx+d[0],ny=cy+d[1];
        if(nx<0||ny<0||nx>=PW||ny>=PH||floor[ny][nx])continue;floor[ny][nx]=1;cells.push([nx,ny])}
      const [sx,sy]=cells[Math.floor(R()*cells.length)];const L={floor};
      const dist=pilarBFS(L,sx,sy);const cand=[];
      for(const [k,dd] of dist){const x=k%PW,y=Math.floor(k/PW)%PH,o=Math.floor(k/(PW*PH));if(o===0&&dd>=12&&dd<=24)cand.push([x,y,dd])}
      if(!cand.length)continue;
      const [gx,gy,par]=cand[Math.floor(R()*cand.length)];
      return{floor,start:[sx,sy],goal:[gx,gy],par};
    }
  }
  throw new Error('sem nível');
}
function foldPilar(L,moves){
  let o=0,[x,y]=L.start,fell=false,solved=false,n=0,prev=null,dir=-1,fall=null;
  for(const d of moves){if(solved)break;n++;prev={o,x,y};dir=d;fall=null;
    const [no,nx,ny]=pilarMove(o,x,y,d);
    if(!pilarOk(L,no,nx,ny)){fall={o:no,x:nx,y:ny,d};o=0;[x,y]=L.start;fell=true}
    else{o=no;x=nx;y=ny;fell=false}
    if(o===0&&x===L.goal[0]&&y===L.goal[1])solved=true}
  return{o,x,y,fell,solved,n,prev,dir,fall};
}
/* ---- Caixas (Sokoban com destinos sem dono) ---- */
const SW=8,SH=8;
function genCaixas(seed,k){
  for(let attempt=0;attempt<40;attempt++){
    const R=rng(seed+attempt*104729);
    for(let tries=0;tries<200;tries++){
      const iw=5+Math.floor(R()*2),ih=5+Math.floor(R()*2);
      const wall=Array.from({length:SH},()=>Array(SW).fill(1));
      for(let y=0;y<ih;y++)for(let x=0;x<iw;x++)wall[1+y][1+x]=0;
      const nw=1+Math.floor(R()*3);
      for(let i=0;i<nw;i++){const x=2+Math.floor(R()*(iw-2)),y=2+Math.floor(R()*(ih-2));wall[y][x]=1}
      const free=[];for(let y=0;y<SH;y++)for(let x=0;x<SW;x++)if(!wall[y][x])free.push([x,y]);
      const seen=new Set([free[0].join()]);const st=[free[0]];
      while(st.length){const [x,y]=st.pop();for(const d of DIRS){const nx=x+d[0],ny=y+d[1];if(wall[ny]&&!wall[ny][nx]&&!seen.has(nx+','+ny)){seen.add(nx+','+ny);st.push([nx,ny])}}}
      if(seen.size!==free.length)continue;
      for(let i=free.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[free[i],free[j]]=[free[j],free[i]]}
      const targets=free.slice(0,k).map(c=>c.slice());let boxes=targets.map(c=>c.slice());let p=free[k].slice();
      const isBox=(x,y)=>boxes.findIndex(b=>b[0]===x&&b[1]===y);
      let pulls=0;
      for(let s=0;s<500;s++){
        const d=DIRS[Math.floor(R()*4)];const qx=p[0]+d[0],qy=p[1]+d[1];
        if(wall[qy][qx]||isBox(qx,qy)>=0)continue;
        const bi=isBox(p[0]-d[0],p[1]-d[1]);
        if(bi>=0&&R()<0.75){boxes[bi]=[p[0],p[1]];pulls++}
        p=[qx,qy];
      }
      const off=boxes.filter(b=>!targets.some(t=>t[0]===b[0]&&t[1]===b[1])).length;
      if(pulls<8||off<k)continue;
      return{wall,targets,boxes,player:p};
    }
  }
  throw new Error('sem nível');
}
const sokoSolved=(L,boxes)=>boxes.every(b=>L.targets.some(t=>t[0]===b[0]&&t[1]===b[1]));
function sokoStep(L,s,d){
  const [dx,dy]=DIRS[d];const qx=s.p[0]+dx,qy=s.p[1]+dy;
  if(L.wall[qy][qx])return null;
  const bi=s.boxes.findIndex(b=>b[0]===qx&&b[1]===qy);
  const boxes=s.boxes.map(b=>b.slice());
  if(bi>=0){const bx=qx+dx,by=qy+dy;if(L.wall[by][bx]||s.boxes.some(b=>b[0]===bx&&b[1]===by))return null;boxes[bi]=[bx,by]}
  return{p:[qx,qy],boxes};
}
function foldCaixas(L,moves){
  let s={p:L.player.slice(),boxes:L.boxes.map(b=>b.slice())},n=0,solved=sokoSolved(L,s.boxes);
  for(const d of moves){if(solved)break;
    if(d===4){s={p:L.player.slice(),boxes:L.boxes.map(b=>b.slice())};n++;continue}   /* reiniciar posição: volta ao início e conta como jogada */
    const t=sokoStep(L,s,d);if(!t)continue;s=t;n++;solved=sokoSolved(L,s.boxes)}
  return{...s,n,solved};
}
/* ---- Picross ---- */
function lineSolve(clue,line){
  const n=line.length,ones=new Array(n).fill(true),zeros=new Array(n).fill(true),cur=new Array(n).fill(0);let any=false;
  function rec(bi,pos){
    if(bi===clue.length){for(let i=pos;i<n;i++){if(line[i]===1)return;cur[i]=0}
      any=true;for(let i=0;i<n;i++){if(cur[i])zeros[i]=false;else ones[i]=false}return}
    const len=clue[bi],rest=clue.slice(bi+1).reduce((a,b)=>a+b+1,0);
    for(let s=pos;s+len+rest<=n;s++){
      let bad=false;for(let i=pos;i<s;i++){if(line[i]===1){bad=true;break}cur[i]=0}
      if(bad)break;
      let ok=true;for(let i=s;i<s+len;i++){if(line[i]===0){ok=false;break}cur[i]=1}
      if(!ok)continue;
      let np=s+len;
      if(bi<clue.length-1){if(line[np]===1)continue;cur[np]=0;np++}
      rec(bi+1,np);
    }
  }
  rec(0,0);if(!any)return null;
  return line.map((v,i)=>ones[i]?1:zeros[i]?0:v);
}
const runsOf=a=>{const r=[];let k=0;for(const v of a){if(v===1)k++;else if(k){r.push(k);k=0}}if(k)r.push(k);return r};
function solvePicross(n,rows,cols){
  const g=Array.from({length:n},()=>Array(n).fill(-1));let ch=true;
  while(ch){ch=false;
    for(let r=0;r<n;r++){const nl=lineSolve(rows[r],g[r]);if(!nl)return null;for(let c=0;c<n;c++)if(nl[c]!==g[r][c]){g[r][c]=nl[c];ch=true}}
    for(let c=0;c<n;c++){const col=g.map(row=>row[c]);const nl=lineSolve(cols[c],col);if(!nl)return null;for(let r=0;r<n;r++)if(nl[r]!==g[r][c]){g[r][c]=nl[r];ch=true}}}
  return g;
}
/* Quão espelhado é o desenho: maior fração de casas iguais ao seu espelho (horizontal, vertical, diagonal ou giro de 180°). */
function picSim(g,n){
  const f=(fn)=>{let k=0;for(let r=0;r<n;r++)for(let c=0;c<n;c++){const [a,b]=fn(r,c);if(g[r][c]===g[a][b])k++}return k/(n*n)};
  return Math.max(f((r,c)=>[r,n-1-c]),f((r,c)=>[n-1-r,c]),f((r,c)=>[c,r]),f((r,c)=>[n-1-c,n-1-r]),f((r,c)=>[n-1-r,n-1-c]));
}
function genPicross(seed,n){
  /* Sem simetria: cada casa sorteada sozinha; desenhos espelhados são recusados.
     Limite de semelhança cai com o tamanho; nas últimas tentativas relaxa um pouco para nunca travar. */
  const lim0=n<=5?.72:n<=6?.72:.68;
  for(let attempt=0;attempt<6000;attempt++){
    const R=rng(seed+attempt*131);const dens=0.5+R()*0.16;
    const g=Array.from({length:n},()=>Array(n).fill(0));
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)g[r][c]=R()<dens?1:0;
    const rows=g.map(runsOf),cols=Array.from({length:n},(_,c)=>runsOf(g.map(row=>row[c])));
    if(rows.some(a=>!a.length)||cols.some(a=>!a.length))continue;
    const tot=g.flat().reduce((a,b)=>a+b,0);if(tot<n*n*0.42||tot>n*n*0.68)continue;
    if(picSim(g,n)>lim0+Math.floor(attempt/1500)*.04)continue;
    const sol=solvePicross(n,rows,cols);if(!sol||sol.some(row=>row.includes(-1)))continue;
    return{n,sol:g.flat(),rows,cols};
  }
  throw new Error('sem picross');
}

/* ---- Damas brasileiras ----
   Tabuleiro 8x8, casas escuras onde (linha+coluna) é ímpar. Azul (A) começa embaixo (linhas 5 a 7) e anda para cima;
   Laranja (B) começa em cima (linhas 0 a 2). Peças: 1 pedra A, 2 dama A, -1 pedra B, -2 dama B.
   Regras: captura obrigatória, lei da maioria (vale a captura que leva mais peças), pedra captura para frente e para trás,
   dama voadora (anda e captura a qualquer distância), peças capturadas só saem no fim do lance e não podem ser saltadas duas vezes,
   pedra que chega ao fundo capturando e ainda pode capturar continua como pedra (só vira dama se parar lá).
   Fim: sem peças ou sem lance legal perde. Empate: 20 lances de cada lado só com damas e sem captura. */
const DM_DIRS=[[-1,-1],[-1,1],[1,-1],[1,1]];
const DM_DRAW_PLIES=40;
function dmStart(){
  const b=new Int8Array(64);
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){if((r+c)%2!==1)continue;if(r<3)b[r*8+c]=-1;else if(r>4)b[r*8+c]=1}
  return b;
}
const dmSide=v=>v>0?1:v<0?-1:0;
/* gera os lances de um lado (side = 1 para Azul, -1 para Laranja). Cada lance: {p:[casas], k:[capturadas]} */
function dmMoves(b,side){
  const caps=[];let best=0;
  for(let s=0;s<64;s++){const v=b[s];if(dmSide(v)!==side)continue;
    const king=Math.abs(v)===2,r0=s>>3,c0=s&7;
    const dead=new Uint8Array(64);b[s]=0;   /* levanta a peça para ela poder passar pela própria casa de origem */
    const path=[s],took=[];
    (function dfs(r,c,n){
      let any=false;
      for(const [dr,dc] of DM_DIRS){
        if(king){
          let rr=r+dr,cc=c+dc;
          while(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]===0){rr+=dr;cc+=dc}
          if(rr<0||rr>7||cc<0||cc>7)continue;
          const t=rr*8+cc;if(dmSide(b[t])!==-side||dead[t])continue;
          let lr=rr+dr,lc=cc+dc;
          while(lr>=0&&lr<8&&lc>=0&&lc<8&&b[lr*8+lc]===0){
            any=true;dead[t]=1;took.push(t);path.push(lr*8+lc);
            dfs(lr,lc,n+1);
            path.pop();took.pop();dead[t]=0;
            lr+=dr;lc+=dc;
          }
        }else{
          const rr=r+dr,cc=c+dc,lr=r+2*dr,lc=c+2*dc;
          if(lr<0||lr>7||lc<0||lc>7)continue;
          const t=rr*8+cc;if(dmSide(b[t])!==-side||dead[t]||b[lr*8+lc]!==0)continue;
          any=true;dead[t]=1;took.push(t);path.push(lr*8+lc);
          dfs(lr,lc,n+1);
          path.pop();took.pop();dead[t]=0;
        }
      }
      if(!any&&n>0){
        if(n>best){best=n;caps.length=0}
        if(n===best)caps.push({p:path.slice(),k:took.slice()});
      }
    })(r0,c0,0);
    b[s]=v;
  }
  if(caps.length)return caps;
  const out=[];
  for(let s=0;s<64;s++){const v=b[s];if(dmSide(v)!==side)continue;
    const king=Math.abs(v)===2,r=s>>3,c=s&7;
    for(const [dr,dc] of DM_DIRS){
      if(!king&&dr!==-side)continue;   /* pedra só anda para a frente */
      let rr=r+dr,cc=c+dc;
      while(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]===0){
        out.push({p:[s,rr*8+cc],k:[]});
        if(!king)break;
        rr+=dr;cc+=dc;
      }
    }
  }
  return out;
}
function dmApply(b,m){
  const nb=b.slice();const from=m.p[0],to=m.p[m.p.length-1];let v=nb[from];
  nb[from]=0;for(const t of m.k)nb[t]=0;
  const r=to>>3;
  if(Math.abs(v)===1&&((v>0&&r===0)||(v<0&&r===7)))v=v*2;
  nb[to]=v;return nb;
}
const dmKey=m=>m.p.join('>');
const dmCount=(b,side)=>{let n=0;for(let i=0;i<64;i++)if(dmSide(b[i])===side)n++;return n};
/* Estado a partir da lista de lances. starter: quem faz o primeiro lance ('A' ou 'B'). */
function foldDamas(moves,starter){
  let b=dmStart(),turn=starter,over=false,winner=null,last=null,plies=0,quiet=0;
  const taken={A:0,B:0};
  const sd=t=>t==='A'?1:-1;
  for(let i=0;i<moves.length&&!over;i++){
    const legal=dmMoves(b,sd(turn));
    const m=legal.find(x=>dmKey(x)===String(moves[i]));
    if(!m)break;
    const piece=b[m.p[0]];
    b=dmApply(b,m);plies++;
    if(m.k.length){taken[turn]+=m.k.length;quiet=0}else if(Math.abs(piece)===1)quiet=0;else quiet++;
    last={from:m.p[0],to:m.p[m.p.length-1],path:m.p,caps:m.k,side:turn};
    turn=turn==='A'?'B':'A';
    if(!dmMoves(b,sd(turn)).length){over=true;winner=turn==='A'?'B':'A'}
    else if(quiet>=DM_DRAW_PLIES){over=true;winner='T'}
  }
  return{b,turn,over,winner,last,plies,taken,quiet};
}
/* ---- robô ---- */
function dmEval(b){
  let s=0;
  for(let i=0;i<64;i++){const v=b[i];if(!v)continue;const r=i>>3,c=i&7,a=Math.abs(v),sg=v>0?1:-1;
    let x=a===2?330:100;
    if(a===1){const adv=sg>0?7-r:r;x+=adv*5;if(adv===0)x+=6}
    if(c>=2&&c<=5&&r>=2&&r<=5)x+=3;
    if(c===0||c===7)x+=a===1?-2:-6;
    s+=sg*x;
  }
  return s;
}
function dmSearch(b,side,depth,alpha,beta){
  const ms=dmMoves(b,side);
  if(!ms.length)return -9000-depth;
  if(depth<=0)return side*dmEval(b);
  ms.sort((x,y)=>y.k.length-x.k.length);
  let best=-1e9;
  for(const m of ms){
    const v=-dmSearch(dmApply(b,m),-side,depth-1,-beta,-alpha);
    if(v>best)best=v;if(best>alpha)alpha=best;if(alpha>=beta)break;
  }
  return best;
}

function dmBotChoice(st,level){
  const side=st.turn==='A'?1:-1,ms=dmMoves(st.b,side);if(!ms.length)return null;
  if(ms.length===1)return dmKey(ms[0]);
  const depth=level>=1?6:level<=.5?2:4,slip=level>=1?0:level<=.5?.4:.08;
  if(Math.random()<slip)return dmKey(ms[Math.floor(Math.random()*ms.length)]);
  let best=-1e9,pick=[];
  for(const m of ms){
    const v=-dmSearch(dmApply(st.b,m),-side,depth-1,-1e9,1e9)+Math.random()*2;
    if(v>best+1e-9){best=v;pick=[m]}else if(Math.abs(v-best)<=1e-9)pick.push(m);
  }
  return dmKey(pick[Math.floor(Math.random()*pick.length)]);
}

    levelCache[key]=room.game==='pilar'?genPilar(seed):room.game==='picross'?genPicross(seed,(PSIZES[room.pz||0]||PSIZE)[Math.min(r,5)]):genCaixas(seed,r===1?2:3)}

const movesOf=side=>listOf(room?.logs?.[roundNow()]?.[side]?.moves);

/* Relógio do turno: cada aparelho marca quando viu a vez mudar. */
const TC={key:'',t0:0};

  if(!room||room.status!=='play'||isPuzzle())return 0;
  const key=`${code}|${room.mid||0}|${roundNow()}|${turnMoves().length}`;

const turnMover=()=>{const r=roundNow(),i=turnMoves().length;return i%2===0?starter(r):other(starter(r))};

function wins(){const w={A:0,B:0};Object.values(room?.res||{}).forEach(v=>{if(v==='A'||v==='B')w[v]++});return w}

  if(room?.solo&&isPuzzle()){const r=roundNow();return(r>=SOLO_FASES&&room.res?.[r])?'A':null}
  if(w.A>=2)return'A';if(w.B>=2)return'B';
  const r=roundNow();if(r>=5&&room?.res?.[r]){return w.A>w.B?'A':w.B>w.A?'B':'T'}return null}

/* ---------- movimentos ---------- */
function myTurnInfo(){
  const s=mySide();if(!s||!room||room.status!=='play')return{ok:false};
  const r=roundNow();if(room.res?.[r])return{ok:false};
  if(Date.now()<room.roundStart)return{ok:false,wait:true};
  if(room.game==='picross')return{ok:!room.logs?.[r]?.[s]?.done,done:!!room.logs?.[r]?.[s]?.done};
  if(isPuzzle()){
    if(room.logs?.[r]?.[s]?.done)return{ok:false,done:true};
    const team=sidePlayers(s);const slot=movesOf(s).length%team.length;
    return{ok:team[slot]?.[0]===me.id,owner:team[slot]?.[1]?.name};
  }
  const mv=turnMoves();const i=mv.length;const mover=i%2===0?starter(r):other(starter(r));
  if(mover!==s)return{ok:false,owner:null,wait2:true};
  const team=sidePlayers(s);const slot=Math.floor(i/2)%team.length;
  return{ok:team[slot]?.[0]===me.id,owner:team[slot]?.[1]?.name};
}
const caixasInicial=(L,st)=>st.p[0]===L.player[0]&&st.p[1]===L.player[1]&&st.boxes.every((b,i)=>b[0]===L.boxes[i][0]&&b[1]===L.boxes[i][1]);
async function puzzleMove(d){
  if(room.game==='picross')return;
  if(room.game==='pilar'&&ui.pilarLock&&Date.now()<ui.pilarLock)return;
  const t=myTurnInfo();if(!t.ok||ui.busy)return;
  const s=mySide(),r=roundNow(),L=levelFor(),mv=movesOf(s);
  if(room.game==='caixas'){const st=foldCaixas(L,mv);
    if(d===4){if(caixasInicial(L,st))return}else if(!sokoStep(L,st,d))return}
  ui.busy=true;
  const next=[...mv,d];
  const f=room.game==='pilar'?foldPilar(L,next):foldCaixas(L,next);
  if(room.game==='pilar'){
    ui.lastPilarSfx=Date.now();
    if(f.fell){
      ui.pilarLock=Date.now()+760;
      sfx('fall');
      setTimeout(()=>{if(room&&room.status==='play'&&room.game==='pilar')sfx('respawn')},640);
    }else if(f.solved){
      sfx('roll');
      setTimeout(()=>{if(room&&room.status==='play'&&room.game==='pilar')sfx('pilarWin')},190);
    }else sfx('roll');
  }else sfx('tick');
  await db.push(`rooms/${code}/logs/${r}/${s}/moves`,d);
  if(f.solved)await db.set(`rooms/${code}/logs/${r}/${s}/done`,{moves:next.length,at:Date.now(),t:Date.now()-room.roundStart});
}
async function turnMove(m){
  const t=myTurnInfo();if(!t.ok||ui.busy)return;ui.busy=true;sfx('tick');
  const r=roundNow(),i=turnMoves().length;
  const ok=await db.setIfAbsent(`rooms/${code}/logs/${r}/M/${mkey(i)}`,m);
  if(!ok){ui.busy=false;ui.msg='';sfx('err')}
}
/* Passa a vez quando o tempo acaba. Escrita "só se vazio": se a jogada e o passe chegarem juntos, vale quem chegou primeiro. */
async function passTurn(){

  const r=roundNow();if(room.res?.[r])return;
  const i=turnMoves().length,key=`${code}|${room.mid||0}|${r}|${i}`;
  if(ui.passFor===key)return;ui.passFor=key;
  try{const ok=await db.setIfAbsent(`rooms/${code}/logs/${r}/M/${mkey(i)}`,'p');if(ok&&myTurnInfo().ok)sfx('err')}catch(e){ui.passFor=null}
}
/* Verifica o tempo: o próprio jogador da vez passa aos 10 s; o anfitrião cobre se ele sumiu. */
function turnWatch(){
  if(!room||room.status!=='play'||isPuzzle()||!db||room.game==='damas')return;
  const r=roundNow();if(room.res?.[r]||Date.now()<room.roundStart)return;
  if(room.solo&&turnMover()==='B')return;
  const el=Date.now()-turnT0();
  if(myTurnInfo().ok){if(el>=TURN_MS)passTurn()}
  else if(room.host===me.id&&el>=TURN_MS+1200)passTurn();
}

  document.querySelectorAll('.tclock').forEach(c=>{

    fi.style.width=(left/TURN_MS*100).toFixed(1)+'%';const sec=Math.ceil(left/1000);if(b.textContent!==String(sec))b.textContent=sec;

async function hostTick(){
  if(!room||room.host!==me.id||room.status!=='play')return;
  const r=roundNow();const now=Date.now();
  if(!room.res?.[r]){
    let w=null;
    if(isPuzzle()&&room.solo){
      if(room.logs?.[r]?.A?.done)w='A';else if(now>room.roundStart+(room.game==='picross'?(room.pz===2?3600000:1800000):900000))w='T';
    }else if(isPuzzle()){
      const dA=room.logs?.[r]?.A?.done,dB=room.logs?.[r]?.B?.done;
      const sc=d=>d.score??d.moves,gr=room.game==='picross'?(room.pz===2?180000:90000):GRACE;
      if(dA&&dB){w=sc(dA)!==sc(dB)?(sc(dA)<sc(dB)?'A':'B'):(dA.at!==dB.at?(dA.at<dB.at?'A':'B'):'T')}
      else if((dA||dB)&&now>(dA||dB).at+gr)w=dA?'A':'B';
      else if(now>room.roundStart+(room.game==='picross'?(room.pz===2?1800000:900000):MAXR))w='T';
    }else{
      const st=turnFold(turnMoves(),starter(r));
      if(st.over)w=st.winner;
      else if(trailingPasses()>=TURN_PASS_MAX)w='T';
      else if(room.solo)botPlay(r,st);
    }
    if(w)await db.set(`rooms/${code}/res/${r}`,w);
  }else if(decided()&&!room.final){
    const w=decided();
    await db.set(`rooms/${code}/final`,w);
    const entry={game:room.game,ts:now,A:turmaOf('A'),B:turmaOf('B'),w,winnerTurma:w==='T'?'':turmaOf(w)};
    if(!room.solo)await db.set(`placar/matches/${code}-${now.toString(36)}`,entry);
  }
}

/* ---------- robô (modo solo nos jogos de turnos) ---------- */
function botChoice(st){
  if(room.game==='damas')return dmBotChoice(st,room.bot||.75);
  const pOpt=room.bot||.75,rnd=a=>a[Math.floor(Math.random()*a.length)];
  if(room.game==='pontos'){
    const all=[1,2,3].filter(k=>k<=st.rem),good=all.filter(k=>(st.rem-k)%4===1);
    return (good.length&&Math.random()<pOpt)?good[0]:rnd(all);
  }
  const all=[];
  for(let x=1;x<=st.a;x++)all.push([x,0]);for(let y=1;y<=st.b;y++)all.push([0,y]);for(let k=1;k<=Math.min(st.a,st.b);k++)all.push([k,k]);
  const good=all.filter(([x,y])=>PERD.some(p=>p[0]===st.a-x&&p[1]===st.b-y));
  const m=(good.length&&Math.random()<pOpt)?good[0]:rnd(all);
  return `${m[0]},${m[1]}`;
}
function botPlay(r,st){
  if(Date.now()<room.roundStart+400)return;
  const mv=turnMoves(),i=mv.length,mover=i%2===0?starter(r):other(starter(r));
  if(mover!=='B')return;
  const key=`${code}|${room.mid||0}|${r}|${i}`;if(ui.botFor===key)return;ui.botFor=key;
  setTimeout(async()=>{
    if(!room||room.status!=='play'||roundNow()!==r||room.res?.[r]||turnMoves().length!==i){if(ui.botFor===key)ui.botFor=null;return}
    try{await db.setIfAbsent(`rooms/${code}/logs/${r}/M/${mkey(i)}`,botChoice(st))}catch(e){ui.botFor=null}
  },800+Math.random()*700);
}

const cf=$('#confetti'),cx=cf.getContext('2d');let parts=[],cfRaf=0;
function confetti(n=130,cols){
  cols=cols||['#1D56D8','#D9531E','#D49A1A','#168053','#181A1F','#F4EFE6'];
  cf.width=innerWidth;cf.height=innerHeight;
  for(let i=0;i<n;i++)parts.push({x:Math.random()*cf.width,y:-20-Math.random()*cf.height*.35,vx:(Math.random()-.5)*3.2,vy:2+Math.random()*4.2,r:Math.random()*6.28,vr:(Math.random()-.5)*.35,w:6+Math.random()*7,h:4+Math.random()*6,c:cols[i%cols.length]});

  cx.clearRect(0,0,cf.width,cf.height);
  for(const p of parts){p.x+=p.vx+Math.sin(p.y/40)*.7;p.y+=p.vy;p.vy+=.035;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}

  if(parts.length)cfRaf=requestAnimationFrame(cfStep);else{cfRaf=0;cx.clearRect(0,0,cf.width,cf.height)}

const easeBack=p=>{const c=1.9;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

    this.geo={ox:this.ox,oy:this.oy,u,n,W:this.W,H:this.H};
  }
  fit(maxW,maxH){if(Math.abs(maxW-this.mw)>1||Math.abs(maxH-this.mh)>1){this.layout(maxW,maxH);this.kick()}}
  count(){let k=0;for(let i=0;i<this.cells.length;i++)if(this.cells[i]===1)k++;return k}
  errs(){let k=0;for(let i=0;i<this.cells.length;i++)if(this.cells[i]===3||this.cells[i]===4)k++;return k}
  hasRed(){for(let i=0;i<this.cells.length;i++)if(this.cells[i]===3)return true;return false}
  clearErrs(){if(this.o.canPlay&&!this.o.canPlay())return;const ch=[];for(let i=0;i<this.cells.length;i++)if(this.cells[i]===3)ch.push([i,4]);if(ch.length){this.apply(ch);if(this.o.onCommit)this.o.onCommit(ch)}}

  checkLines(silent){
    const k=this.doneKey();

      for(let i=0;i<a.length;i++)if(a[i]==='1'&&a0[i]!=='1'){this.flash.push({k:'r',i,t0:performance.now()});any=true}
      for(let i=0;i<b.length;i++)if(b[i]==='1'&&b0[i]!=='1'){this.flash.push({k:'c',i,t0:performance.now()});any=true}
      if(any&&this.o.sfx)this.o.sfx('line')}

  }
  setCells(map){
    const now=performance.now();const silent=this.first;

      shadowAlpha=0;
      const cx=verts.reduce((s,v)=>s+v[0],0)/8,cy=verts.reduce((s,v)=>s+v[1],0)/8;
      fallLayer={cx,cy};
    }else{
      /* fase 3: respawn caindo de cima com bounce suave no ponto inicial */
      const p=(dt-T2)/(S.dur-T2);
      const drop=p<.65?(1-Math.pow(p/.65,2))*2.45:Math.sin((p-.65)/.35*Math.PI)*.24*(1-(p-.65)/.35);
      if(p>=.65&&!S.landed){
        S.landed=true;
        spawnPilarDust(S,S.cur.x+.5,S.cur.y+.5,0,'#D49A1A',5,-1);
        if(S.remoteSfx)sfx('respawn');
      }
      bRef=S.cur;rDir=-1;rAng=0;
      verts=pilarVerts(bRef,-1,0,0,0,drop);
      alpha=Math.min(1,p*3.2);
      const sc=Math.max(.35,1-drop*.22);
      shadowBox={x:S.cur.x+(1-sc)/2,y:S.cur.y+(1-sc)/2,w:sc,h:sc};
      shadowAlpha=.2*sc;
      if(p>=.65)landRing=(p-.65)/.35;
    }
  }else if(S.mode==='win'&&dt<S.dur){
    animActive=true;
    const T1=180,T2=240;
    if(dt<T1){
      const p=dt/T1,e=1-Math.pow(1-p,2.6);
      bRef=S.from;rDir=S.dir;rAng=e*Math.PI/2;
      verts=pilarVerts(bRef,rDir,rAng);
    }else if(dt<T2){
      verts=pilarVerts(S.cur,-1,0);
      goalPulse=(dt-T1)/(T2-T1)*.3;
    }else{
      const p=(dt-T2)/(S.dur-T2),e=p*p;
      verts=pilarVerts(S.cur,-1,0,0,0,-2.1*e);
      clipGoal=true;shadowAlpha=0;goalPulse=.3+.7*p;
    }
  }else{
    if(S.mode==='win'){verts=pilarVerts(S.cur,-1,0,0,0,-2.1);clipGoal=true;shadowAlpha=0}
    else{S.mode='idle';verts=pilarVerts(S.cur,-1,0)}
  }

  /* limpar partículas expiradas */
  S.dust=S.dust.filter(pt=>now-pt.t0<pt.dur);
  if(S.dust.length)animActive=true;

  /* função que desenha o prisma 3D a partir dos 8 vértices */
  const drawBlock=()=>{
    if(!verts||alpha<=.01)return;
    g.save();
    g.globalAlpha=alpha;
    if(clipGoal){
      const [gx,gy]=L.goal;
      const gPts=[P(gx+.04,gy+.04,0),P(gx+.96,gy+.04,0),P(gx+.96,gy+.96,0),P(gx+.04,gy+.96,0)];
      /* permitir que o pilar apareça acima do buraco, mas desapareça abaixo da borda inferior */
      g.beginPath();
      g.moveTo(0,0);g.lineTo(W,0);g.lineTo(W,gPts[1][1]);
      g.lineTo(gPts[1][0],gPts[1][1]);g.lineTo(gPts[2][0],gPts[2][1]);g.lineTo(gPts[3][0],gPts[3][1]);
      g.lineTo(0,gPts[3][1]);g.closePath();g.clip();
    }
    const vis=[];
    for(const f of PILAR_FACES){
      const pts3=f.idx.map(i=>verts[i]);
      const e1=[pts3[1][0]-pts3[0][0],pts3[1][1]-pts3[0][1],pts3[1][2]-pts3[0][2]];
      const e2=[pts3[2][0]-pts3[0][0],pts3[2][1]-pts3[0][1],pts3[2][2]-pts3[0][2]];
      let nx=e1[1]*e2[2]-e1[2]*e2[1],ny=e1[2]*e2[0]-e1[0]*e2[2],nz=e1[0]*e2[1]-e1[1]*e2[0];
      const len=Math.hypot(nx,ny,nz)||1;nx/=len;ny/=len;nz/=len;
      /* vetor de visão da projeção Pj é (1,1,1) */
      if(nx+ny+nz<=.001)continue;
      const depth=pts3.reduce((s,v)=>s+v[0]+v[1]+v[2],0)/4;
      const isCap=f.axis===bRef.o;
      const light=Math.max(0,Math.min(1,.42+nz*.45+ny*.16-nx*.12));
      const fill=isCap?mixRGB([188,132,20],[234,178,46],light):mixRGB([172,60,18],[244,142,56],light);
      vis.push({pts3,depth,fill,isCap});
    }
    vis.sort((a,b)=>a.depth-b.depth);
    for(const f of vis){
      const p2=f.pts3.map(([x,y,z])=>P(x,y,z));
      poly(p2,f.fill,'#6E260A',1.4);
      if(f.isCap){
        const c3=[0,1,2].map(k=>f.pts3.reduce((s,v)=>s+v[k],0)/4);
        const inn=f.pts3.map(v=>P(lerp(c3[0],v[0],.52),lerp(c3[1],v[1],.52),lerp(c3[2],v[2],.52)));
        poly(inn,null,'#181A1F',1.3);
        const dot=P(c3[0],c3[1],c3[2]);
        g.fillStyle='#181A1F';g.beginPath();g.arc(dot[0],dot[1],Math.max(2,tw*.055),0,7);g.fill();
      }
    }
    g.restore();
  };

  /* preparar desenho do cenário */
  g.clearRect(0,0,W,H);g.fillStyle='#E6DFD1';g.fillRect(0,0,W,H);
  const T=.22;
  const tiles=[];for(let y=0;y<PH;y++)for(let x=0;x<PW;x++)if(L.floor[y][x])tiles.push([x,y]);
  tiles.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1])||a[0]-b[0]);
  const fl=(x,y)=>y>=0&&x>=0&&y<PH&&x<PW&&L.floor[y][x];
  const [gx,gy]=L.goal;

  const drawTile=(x,y)=>{
    if(!fl(x,y+1))poly([P(x,y+1,0),P(x+1,y+1,0),P(x+1,y+1,-T),P(x,y+1,-T)],'#CFC6B4','#B8AE9A',1);
    if(!fl(x+1,y))poly([P(x+1,y,0),P(x+1,y+1,0),P(x+1,y+1,-T),P(x+1,y,-T)],'#BCB29D','#A69B86',1);
    poly([P(x,y,0),P(x+1,y,0),P(x+1,y+1,0),P(x,y+1,0)],(x+y)%2?'#F3EDE0':'#FFFDF9','#C9C0AE',1);
    if(x===gx&&y===gy){
      poly([P(gx,gy,0),P(gx+1,gy,0),P(gx+1,gy+1,0),P(gx,gy+1,0)],'#181A1F');
      for(const [m,lw] of [[.12,tw*.05],[.27,tw*.03]]){
        poly([P(gx+m,gy+m,0),P(gx+1-m,gy+m,0),P(gx+1-m,gy+1-m,0),P(gx+m,gy+1-m,0)],null,'#D49A1A',lw);
      }
    }
  };

  /* sombra da ilha */
  for(const [x,y] of tiles){poly([P(x,y,-T-.08),P(x+1,y,-T-.08),P(x+1,y+1,-T-.08),P(x,y+1,-T-.08)],'rgba(24,26,31,.06)')}

  if(fallLayer){
    /* durante a queda no abismo, ladrilhos à frente tampam o pilar caindo atrás da ilha */
    const back=[],front=[];
    for(const [x,y] of tiles){
      if(x+1>fallLayer.cx-.05&&y+1>fallLayer.cy-.05)front.push([x,y]);
      else back.push([x,y]);
    }
    for(const [x,y] of back)drawTile(x,y);
    drawBlock();
    for(const [x,y] of front)drawTile(x,y);
  }else{
    for(const [x,y] of tiles)drawTile(x,y);
    /* sombra projetada no piso */
    if(shadowAlpha>0){
      if(shadowBox){
        poly([P(shadowBox.x,shadowBox.y,0),P(shadowBox.x+shadowBox.w,shadowBox.y,0),P(shadowBox.x+shadowBox.w,shadowBox.y+shadowBox.h,0),P(shadowBox.x,shadowBox.y+shadowBox.h,0)],`rgba(24,26,31,${shadowAlpha})`);
      }else if(verts){
        let sx0=1e9,sx1=-1e9,sy0=1e9,sy1=-1e9;
        for(const [vx,vy] of verts){sx0=Math.min(sx0,vx);sx1=Math.max(sx1,vx);sy0=Math.min(sy0,vy);sy1=Math.max(sy1,vy)}
        poly([P(sx0,sy0,0),P(sx1,sy0,0),P(sx1,sy1,0),P(sx0,sy1,0)],`rgba(24,26,31,${shadowAlpha})`);
      }
    }
    /* anel de impacto ao respawnar */
    if(landRing>0&&landRing<1){
      const e=landRing,m=.5*(1-e*.75);
      g.save();g.globalAlpha=1-e;
      poly([P(S.cur.x+m-.15*e,S.cur.y+m-.15*e,0),P(S.cur.x+1-m+.15*e,S.cur.y+m-.15*e,0),P(S.cur.x+1-m+.15*e,S.cur.y+1-m+.15*e,0),P(S.cur.x+m-.15*e,S.cur.y+1-m+.15*e,0)],null,'#D9531E',2.2);
      g.restore();
    }
    drawBlock();
    /* brilho dourado ao encaixar no alvo */
    if(goalPulse>0&&goalPulse<1){
      const e=goalPulse,ex=.28*e;
      g.save();g.globalAlpha=(1-e)*.9;
      poly([P(gx-ex,gy-ex,0),P(gx+1+ex,gy-ex,0),P(gx+1+ex,gy+1+ex,0),P(gx-ex,gy+1+ex,0)],null,'#D49A1A',3);
      g.restore();
    }
  }

  /* partículas de poeira */
  for(const pt of S.dust){
    const p=(now-pt.t0)/pt.dur;
    const x=pt.x+pt.vx*p,y=pt.y+pt.vy*p,z=pt.z+pt.vz*p-1.9*p*p;
    const [px,py]=P(x,y,z);
    g.save();g.globalAlpha=Math.max(0,1-p);
    g.fillStyle=pt.col;g.beginPath();g.arc(px,py,pt.sz*(1-p*.45),0,7);g.fill();
    g.restore();
  }

  if(animActive&&!S.raf){S.raf=requestAnimationFrame(()=>{S.raf=0;pilarFrame(S)})}
}
/* ---------- Caixas ---------- */
function sizeCanvas(c,W,H,box){
  const cell=Math.max(10,Math.floor(Math.min(box.maxW/W,box.maxH/H)));
  const g=dprSize(c,cell*W,cell*H);return{cell,g};
}
function drawCaixas(c,L,st,box,tc){
  const {cell,g}=sizeCanvas(c,SW,SH,box);tc=tc||'#1D56D8';
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){
    if(L.wall[y][x]){g.fillStyle='#23262E';g.fillRect(x*cell,y*cell,cell,cell);g.fillStyle='#2F333D';g.fillRect(x*cell+2,y*cell+2,cell-4,cell-4);g.fillStyle='#23262E';g.fillRect(x*cell+5,y*cell+5,cell-10,cell-10)}
    else{g.fillStyle='#F7F3EA';g.fillRect(x*cell,y*cell,cell,cell);g.strokeStyle='#E3DCCE';g.strokeRect(x*cell+.5,y*cell+.5,cell-1,cell-1)}}
  g.strokeStyle='#1D56D8';g.lineWidth=2.6;const m=cell*.13,l=cell*.23;
  for(const [tx,ty] of L.targets){const X=tx*cell,Y=ty*cell;
    g.beginPath();[[X+m,Y+m,1,1],[X+cell-m,Y+m,-1,1],[X+m,Y+cell-m,1,-1],[X+cell-m,Y+cell-m,-1,-1]].forEach(([a,b,sx,sy])=>{g.moveTo(a+sx*l,b);g.lineTo(a,b);g.lineTo(a,b+sy*l)});g.stroke();
    g.fillStyle='rgba(29,86,216,.14)';g.beginPath();g.moveTo(X+cell/2,Y+cell*.33);g.lineTo(X+cell*.67,Y+cell/2);g.lineTo(X+cell/2,Y+cell*.67);g.lineTo(X+cell*.33,Y+cell/2);g.closePath();g.fill()}
  g.lineWidth=1;
  for(const [bx,by] of st.boxes){const on=L.targets.some(t=>t[0]===bx&&t[1]===by);const X=bx*cell+4,Y=by*cell+4,S=cell-8;
    g.fillStyle=on?'#168053':'#C98A4B';rr(g,X,Y,S,S,5);g.fill();g.strokeStyle=on?'#0E5436':'#6E431B';g.lineWidth=2;g.stroke();
    if(on){g.strokeStyle='#FFFDF9';g.lineWidth=Math.max(2,cell*.08);g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(X+S*.27,Y+S*.52);g.lineTo(X+S*.44,Y+S*.69);g.lineTo(X+S*.74,Y+S*.32);g.stroke()}
    else{g.strokeStyle='rgba(110,67,27,.5)';g.lineWidth=1.5;g.beginPath();for(const f of [.34,.66]){g.moveTo(X+4,Y+S*f);g.lineTo(X+S-4,Y+S*f)}g.stroke()}
    g.lineWidth=1}
  const px=st.p[0]*cell+cell/2,py=st.p[1]*cell+cell/2;
  g.fillStyle='#FFFDF9';g.beginPath();g.arc(px,py,cell*.33,0,7);g.fill();
  g.fillStyle='#181A1F';g.beginPath();g.arc(px,py,cell*.27,0,7);g.fill();
  g.fillStyle=tc;g.beginPath();g.arc(px,py,cell*.11,0,7);g.fill();
}

      if(isPuzzle())return `<div class="sb B"><i></i><div><b>Treino solo</b><small>${esc(GAMES[room.game].nome)}</small></div></div>`;

/* ---------- Damas: interface ---------- */
const CROWN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18.5l-1.2-10 5.2 4.2L12 5l4.5 7.7 5.2-4.2-1.2 10z" fill="currentColor"/></svg>';
const dmNote=m=>m.path.map(dmName).join(m.caps.length?'×':'-');
function dmPathNow(){
  const key=`${code}|${room.mid||0}|${roundNow()}|${turnMoves().length}`;
  if(ui.dk!==key){ui.dk=key;ui.dpath=[]}
  return ui.dpath||(ui.dpath=[]);
}
function dmBoardHTML(st,o){
  const origins=new Set(),nexts=new Set(),path=o.path||[];
  if(o.legal)for(const m of o.legal){
    if(!path.length)origins.add(m.p[0]);
    else if(m.p.length>path.length&&path.every((q,i)=>m.p[i]===q))nexts.add(m.p[path.length]);
  }
  const last=st.last,lastSet=new Set(last?[last.from,last.to]:[]),capd=new Set(last?last.caps:[]);
  let h=`<div class="dboard" style="--dsz:${o.px}px">`;
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
    const r=o.flip?7-i:i,c=o.flip?7-j:j,q=r*8+c,dark=(r+c)%2===1,v=st.b[q];
    const cl=['dsq',dark?'d':'l'];
    if(dark){
      if(lastSet.has(q))cl.push('last');if(capd.has(q))cl.push('capd');
      if(path[0]===q)cl.push('sel');else if(path.includes(q))cl.push('trail');
      if(nexts.has(q))cl.push('tgt');if(origins.has(q))cl.push('mov');
    }
    const pc=v?`<span class="pc ${v>0?'A':'B'} ${Math.abs(v)===2?'k':''}">${Math.abs(v)===2?CROWN:''}</span>`:'';
    h+=dark&&o.tap?`<div class="${cl.join(' ')}" data-act="dsq" data-sq="${q}">${pc}</div>`:`<div class="${cl.join(' ')}">${pc}</div>`;
  }
  return h+'</div>';
}
function damasBody(res){
  const r=roundNow(),s=mySide(),solo=room.solo,mv=turnMoves(),stt=starter(r);
  const st=foldDamas(mv,stt),t=myTurnInfo(),i=mv.length,mover=st.turn;
  const mteam=sidePlayers(mover),mname=mteam.length>1?mteam[Math.floor(i/2)%mteam.length]?.[1]?.name:'';
  let msg='',cls='';
  if(Date.now()<room.roundStart)msg='Prepare-se…';
  else if(res)msg=res==='T'?'Empate.':solo?(res==='A'?'Você venceu a rodada!':'O robô venceu a rodada.'):`Rodada encerrada: vence ${SIDE[res]}.`;
  else if(st.over)msg='Fim de jogo…';
  else if(t.ok){msg='Sua vez!';cls=s}
  else if(solo)msg='Vez do robô…';
  else msg=mover===s&&mname?`Vez de ${esc(mname)}, da sua equipe`:`Vez da equipe ${SIDE[mover]}${mname?' · '+esc(mname):''}`;
  const myTurn=t.ok&&!res&&!st.over;
  const legal=myTurn?dmMoves(st.b,s==='A'?1:-1):null;
  let path=dmPathNow();
  if(!legal)path=ui.dpath=[];
  const bx=boardBox('pl'),px=Math.floor(Math.max(220,Math.min(bx.maxW,bx.maxH)));
  const board=dmBoardHTML(st,{flip:s==='B',legal,path,tap:myTurn,px});
  const nA=dmCount(st.b,1),nB=dmCount(st.b,-1);
  const chip=(sd,n)=>`<span class="dc ${sd}${s===sd?' me':''}">${esc(nameSide(sd))}<b>${n}</b></span>`;
  let hint='';
  if(myTurn){
    const mand=legal.some(m=>m.k.length);
    hint=path.length?(mand?'Continue a captura: toque na próxima casa.':'Toque na casa de destino.'):mand?'Captura obrigatória: escolha a que leva mais peças.':'Toque na peça que quer mover.';
  }
  const who=`${solo?(stt==='A'?'Você começa':'O robô começa'):SIDE[stt]+' começa'} esta rodada${t.owner&&myTurn&&room.size>1?' · jogada '+(room.size===2?'da dupla':'da equipe'):''}`;
  const quiet=st.quiet>=16?`<p class="sel-note">Só damas e sem captura: ${st.quiet} de ${DM_DRAW_PLIES} lances (empate aos ${DM_DRAW_PLIES}).</p>`:'';
  return `<div class="gx">
    <div class="g-msg"><div class="msg ${cls}">${msg}</div><p class="sel-note" style="margin-top:6px">${who}</p></div>
    <div class="g-board dm">${board}</div>
    <div class="g-meta"><div class="dmeta">${chip('A',nA)}${chip('B',nB)}</div></div>
    <div class="g-tools">${hint?`<p class="sel-note" style="margin-bottom:8px">${hint}</p>`:''}${path.length?'<button class="btn sec" data-act="dcancel">Desfazer seleção</button>':''}${quiet}</div>
    <div class="g-info"></div>
  </div>`;
}
async function damasTap(q){
  const t=myTurnInfo();if(!t.ok||ui.busy)return;
  const r=roundNow(),mv=turnMoves(),st=foldDamas(mv,starter(r));if(st.over||room.res?.[r])return;
  const legal=dmMoves(st.b,mySide()==='A'?1:-1);let path=dmPathNow().slice();
  const startsWith=(m,p)=>m.p.length>=p.length&&p.every((x,k)=>m.p[k]===x);
  if(!path.length){
    if(legal.some(m=>m.p[0]===q)){ui.dpath=[q];sfx('tick');render()}
    return;
  }
  if(path.length===1&&q===path[0]){ui.dpath=[];render();return}
  const np=path.concat(q);
  if(legal.some(m=>m.p.length>path.length&&startsWith(m,np))){
    const done=legal.find(m=>m.p.length===np.length&&startsWith(m,np));
    if(done){ui.dpath=[];await turnMove(dmKey(done))}else{ui.dpath=np;sfx('tick');render()}
    return;
  }
  if(path.length===1&&legal.some(m=>m.p[0]===q)){ui.dpath=[q];sfx('tick');render()}
}
function telaDamas(res){
  const r=roundNow(),stt=starter(r),mv=turnMoves(),st=foldDamas(mv,stt);
  const nm=sd=>room.solo?(sd==='A'?'Você':'Robô'):SIDE[sd];
  const mover=st.turn,mt=sidePlayers(mover),mn=mt.length>1?mt[Math.floor(mv.length/2)%mt.length]?.[1]?.name:'';
  const px=Math.floor(Math.max(240,Math.min(innerWidth-48,innerHeight-255,680)));
  const who=res?'':`<div class="tinfo center" style="margin-bottom:10px">Vez de <span style="color:var(--team-${mover==='A'?'a':'b'})">${room.solo?nm(mover):'equipe '+SIDE[mover]}</span>${mn?' · '+esc(mn):''}</div>`;
  const chip=(sd)=>`<span class="dc ${sd}">${esc(nm(sd))}<b>${dmCount(st.b,sd==='A'?1:-1)}</b></span>`;
  /* reconstrói as notações dos últimos lances */
  const notes=[];{let b=dmStart(),tn=stt;for(const m of mv){const lg=dmMoves(b,tn==='A'?1:-1).find(x=>dmKey(x)===String(m));if(!lg)break;notes.push({side:tn,txt:dmNote({path:lg.p,caps:lg.k})});b=dmApply(b,lg);tn=tn==='A'?'B':'A'}}
  const log=notes.slice(-10).map(n=>`<span class="${n.side}">${nm(n.side)}: ${n.txt}</span>`).join('');
  return `<div class="tturn">${who}<div class="dmeta big">${chip('A')}${chip('B')}</div><div class="dtela">${dmBoardHTML(st,{flip:false,legal:null,path:[],tap:false,px})}</div><div class="tlog">${log}</div></div>`;
}

const seenRes={};let cdKey='';
function resultInfo(res,r,fin){
  const s=mySide(),solo=room.solo;
  if(solo&&isPuzzle())return fin?{t:'Treino concluído!',sub:'Você completou as '+SOLO_FASES+' fases',good:true}:{t:'Fase '+r+' concluída',sub:'',good:true};
  const col=x=>x==='A'?'var(--team-a)':x==='B'?'var(--team-b)':'var(--ink)';
  if(fin){
    if(fin==='T')return{t:'Empate na partida',sub:'',good:null};
    if(solo)return{t:fin==='A'?'Você venceu a partida!':'O robô venceu a partida',sub:'',good:fin==='A'};
    return{t:`Vitória da equipe<br><span style="color:${col(fin)}">${SIDE[fin]}</span>`,sub:esc(turmaOf(fin)),good:!s||s===fin,lose:!!s&&s!==fin};
  }
  if(res==='T')return{t:`Rodada ${r}<br>Empate`,sub:'',good:null};
  if(solo)return{t:`Rodada ${r}<br><span style="color:${col(res)}">${res==='A'?'Você venceu':'Robô venceu'}</span>`,sub:'',good:res==='A'};
  return{t:`Rodada ${r}<br><span style="color:${col(res)}">Vence ${SIDE[res]}</span>`,sub:'',good:!s||s===res,lose:!!s&&s!==res};
}
function resultFx(){
  if(!room||!code||room.status!=='play')return;
  const r=roundNow(),res=room.res?.[r],key=`${code}|${room.mid||0}|${r}`;
  if(!(key in seenRes)){seenRes[key]=!!res;return}
  if(!res||seenRes[key])return;seenRes[key]=true;
  const fin=decided(),i=resultInfo(res,r,fin);
  fxShow(`<div class="fxmsg">${i.t}${i.sub?`<small>${i.sub}</small>`:''}</div>`,fin?4300:2200);
  if(i.good){confetti(fin?230:90);sfx('win')}else if(i.lose||i.good===false)sfx('lose');
}
function fxCountdown(){
  if(!room||!code||room.status!=='play'){if(cdKey){cdKey='';fxHide()}return}
  const rem=room.roundStart-Date.now();let k='';
  if(rem>0)k=rem>3000?'p':String(Math.ceil(rem/1000));else if(rem>-700)k='g';
  const key=k?`${code}|${room.mid||0}|${roundNow()}|${k}`:'';
  if(key===cdKey)return;

  if(!k){if(had)fxHide();return}
  if(k==='p')fxShow('<div class="fxmsg">Prepare-se<small>'+esc(GAMES[room.game].nome)+' · '+(room.solo&&isPuzzle()?'fase ':'rodada ')+roundNow()+'</small></div>');

  if(room&&room.status==='play'){

    if(started!==wasStarted){wasStarted=started;render()}
  }
  hostTick().catch(()=>{});
},500);
setInterval(()=>{timerTick();try{turnWatch();turnClockTick();fxCountdown()}catch(e){}},60);

(async()=>{
  try{db=FIREBASE_CONFIG?await makeFirebaseDB(FIREBASE_CONFIG):makeLocalDB()}
  catch(e){app.innerHTML='<p class="center" style="margin-top:44px">Não consegui conectar ao Firebase. Confira a configuração.</p>';return}
  window.__arena={dmMoves,dmBotChoice,foldDamas,dmKey,dmStart,dmApply,PicrossBoard,genPicross,picSim,solvePicross,levelFor,ui,PSIZE,PSIZES,fmtC,board:()=>PX?.board,tboards:()=>TX?.boards,genPilar,genCaixas,foldPilar,foldCaixas,pilarBFS,pilarMove,pilarOk,sokoStep,foldPontos,foldPilhas,pilhasOk,botChoice,rng,hash,boardBox,get room(){return room},me};
  if(code){const r=await db.get('rooms/'+code);if(r)subscribe();else{code=null;ls.set('arena_code',null)}}
  paintMute();render();
})();
